<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="{{ site.description }}">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%231d4ed8'/%3E%3Cpath d='M26 68V32h16c9 0 15 5 15 13 0 5-2 9-6 11l9 12H45l-7-10h-3v10H26zm12-20h3c4 0 6-2 6-5s-2-5-6-5h-3v10z' fill='white'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  <script>
    (function () {
      const saved = localStorage.getItem('theme');
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      const theme = saved || (prefersDark ? 'dark' : 'light');
      document.documentElement.dataset.theme = theme;
    })();
  </script>
</head>
<body>
  <a class="skip-link" href="#content">Skip to content</a>
  <header class="site-header">
    <div class="shell nav-shell">
      <a class="brand" href="{{ '/' | relative_url }}">SP</a>
      <nav class="site-nav" aria-label="Primary navigation">
        <a href="#about">About</a>
        <a href="#experience">Experience</a>
        <a href="#skills">Skills</a>
        <a href="#education">Education</a>
        <a href="#projects">Projects</a>
        <a href="#publications">Publications</a>
      </nav>
      <button class="theme-toggle" type="button" aria-label="Toggle theme" data-theme-toggle>
        <span class="theme-toggle__icon" aria-hidden="true">◐</span>
      </button>
    </div>
  </header>

  <main id="content">
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="shell footer-shell">
      <p>© 2026 Shreya Ponnamma</p>
      <div class="footer-links">
        <a href="mailto:ponnammapuggera@gmail.com">Email</a>
        <a href="https://linkedin.com/in/shreya-ponnamma-13578b148" target="_blank" rel="noreferrer">LinkedIn</a>
        <a href="https://github.com/shreyaponnamma" target="_blank" rel="noreferrer">GitHub</a>
      </div>
    </div>
  </footer>

  <script src="{{ '/assets/js/main.js' | relative_url }}"></script>
</body>
</html>
